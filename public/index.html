<!DOCTYPE html>
<html lang="en" data-theme="">
  <head>
    <link rel="manifest" href="./manifest.json" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src 'self' data: https: http:;
        connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*;
        font-src 'self' https://fonts.gstatic.com;
        child-src 'none';
      "
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- End of headStart -->
    <meta name="viewport" content="width=device-width">
    <meta name="generator" content="Neurai webwallet for Neurai (XNA) with assets NFT & FT">
    <meta name="description" content="Neurai webwallet for Neurai (XNA) with assets NFT & FT">
    <link rel="icon" href="favicon.png">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Neurai webwallet">
    <meta property="og:description" content="Neurai webwallet for Neurai (XNA) with assets NFT & FT">
    <meta name="twitter:image" content="header.jpg">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Neurai webwallet">
    <meta name="twitter:description" content="Neurai webwallet for Neurai (XNA) with assets NFT & FT">
    <meta name="twitter:image" content="header.jpg">


    <title>Neurai Wallet</title>
    <link rel="stylesheet" href="./style.css" />

    <script>
      // Default to light mode. The user's choice (if any) is restored in src/index.tsx
      // from localStorage and overrides this default.
      document.querySelector("html").setAttribute("data-theme", "light");
    </script>
  </head>
  <body>
    <main class="mx-auto max-w-7xl w-full px-4 py-6 md:px-6 flex-1 flex flex-col">
      <div id="app" class="flex flex-col gap-5 flex-1"></div>
    </main>
    <script type="module" src="../src/index.tsx"></script>
  </body>
</html>
